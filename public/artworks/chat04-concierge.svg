<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" fill="none" width="100%" height="100%" aria-hidden="true">
  <defs>
    <linearGradient id="chat04-sky" x1="0" y1="0" x2="640" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b192c" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#946528" stop-opacity="0.08" />
    </linearGradient>
    <linearGradient id="chat04-gold-beam" x1="200" y1="60" x2="440" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#946528" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#c89b4b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#946528" stop-opacity="0.2" />
    </linearGradient>
    <radialGradient id="chat04-ambient" cx="320" cy="200" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c89b4b" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0b192c" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient glow -->
  <rect width="640" height="400" fill="url(#chat04-sky)" />
  <circle cx="320" cy="180" r="220" fill="url(#chat04-ambient)" />

  <!-- Architectural Background Grid -->
  <g stroke="#0b192c" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="3 6">
    <line x1="80" y1="40" x2="80" y2="360" />
    <line x1="160" y1="40" x2="160" y2="360" />
    <line x1="240" y1="40" x2="240" y2="360" />
    <line x1="320" y1="20" x2="320" y2="360" />
    <line x1="400" y1="40" x2="400" y2="360" />
    <line x1="480" y1="40" x2="480" y2="360" />
    <line x1="560" y1="40" x2="560" y2="360" />
    <line x1="40" y1="120" x2="600" y2="120" />
    <line x1="40" y1="200" x2="600" y2="200" />
    <line x1="40" y1="280" x2="600" y2="280" />
  </g>

  <!-- Central Architectural Portal / Grand Arch -->
  <path d="M220 340 V180 A100 100 0 0 1 420 180 V340" stroke="#0b192c" stroke-opacity="0.3" stroke-width="2" />
  <path d="M240 340 V185 A80 80 0 0 1 400 185 V340" stroke="url(#chat04-gold-beam)" stroke-width="2" />
  <path d="M260 340 V195 A60 60 0 0 1 380 195 V340" stroke="#0b192c" stroke-opacity="0.18" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Keystones and Pediment -->
  <line x1="320" y1="80" x2="320" y2="105" stroke="#946528" stroke-width="3" stroke-linecap="round" />
  <circle cx="320" cy="115" r="4" fill="#946528" />

  <!-- Flanking Architectural Pilasters / Pillars -->
  <!-- Left Pillar -->
  <rect x="130" y="140" width="40" height="200" rx="4" stroke="#0b192c" stroke-opacity="0.25" stroke-width="1.5" fill="none" />
  <line x1="140" y1="150" x2="140" y2="330" stroke="#946528" stroke-opacity="0.4" stroke-width="1.5" />
  <line x1="150" y1="150" x2="150" y2="330" stroke="#0b192c" stroke-opacity="0.15" stroke-width="1" />
  <line x1="160" y1="150" x2="160" y2="330" stroke="#946528" stroke-opacity="0.4" stroke-width="1.5" />
  <!-- Left Capital -->
  <rect x="124" y="132" width="52" height="8" rx="2" fill="#946528" fill-opacity="0.3" stroke="#946528" stroke-width="1" />

  <!-- Right Pillar -->
  <rect x="470" y="140" width="40" height="200" rx="4" stroke="#0b192c" stroke-opacity="0.25" stroke-width="1.5" fill="none" />
  <line x1="480" y1="150" x2="480" y2="330" stroke="#946528" stroke-opacity="0.4" stroke-width="1.5" />
  <line x1="490" y1="150" x2="490" y2="330" stroke="#0b192c" stroke-opacity="0.15" stroke-width="1" />
  <line x1="500" y1="150" x2="500" y2="330" stroke="#946528" stroke-opacity="0.4" stroke-width="1.5" />
  <!-- Right Capital -->
  <rect x="464" y="132" width="52" height="8" rx="2" fill="#946528" fill-opacity="0.3" stroke="#946528" stroke-width="1" />

  <!-- Concierge Desk / Interaction Sphere -->
  <path d="M260 300 Q320 285 380 300 L380 340 L260 340 Z" fill="#0b192c" fill-opacity="0.06" stroke="#0b192c" stroke-opacity="0.25" stroke-width="1.5" />
  <ellipse cx="320" cy="296" rx="60" ry="8" fill="#ffffff" stroke="url(#chat04-gold-beam)" stroke-width="1.5" />
  
  <!-- Modern Geometric Reception Beacon -->
  <circle cx="320" cy="245" r="18" fill="none" stroke="#946528" stroke-width="1.5" />
  <circle cx="320" cy="245" r="7" fill="#946528" fill-opacity="0.8" />
  <circle cx="320" cy="245" r="28" fill="none" stroke="#946528" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="3 3" />

  <!-- Signal / Pulse Lines for Support Connection -->
  <path d="M280 245 C270 235 250 235 235 245" stroke="#946528" stroke-opacity="0.35" stroke-width="1.5" stroke-linecap="round" />
  <path d="M360 245 C370 235 390 235 405 245" stroke="#946528" stroke-opacity="0.35" stroke-width="1.5" stroke-linecap="round" />

  <!-- Foundation Baseline -->
  <line x1="80" y1="340" x2="560" y2="340" stroke="#0b192c" stroke-opacity="0.4" stroke-width="2" />
  <line x1="60" y1="346" x2="580" y2="346" stroke="#946528" stroke-opacity="0.3" stroke-width="1" />
</svg>
