<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" fill="none" width="100%" height="100%" aria-hidden="true">
  <defs>
    <linearGradient id="chat05-sky" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b192c" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#8d6c38" stop-opacity="0.07" />
    </linearGradient>
    <linearGradient id="chat05-brass-beam" x1="160" y1="40" x2="480" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8d6c38" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#c5a880" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#8d6c38" stop-opacity="0.3" />
    </linearGradient>
    <radialGradient id="chat05-glow" cx="320" cy="180" r="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c5a880" stop-opacity="0.14" />
      <stop offset="60%" stop-color="#0b192c" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#0b192c" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient background glow -->
  <rect width="640" height="360" fill="url(#chat05-sky)" />
  <ellipse cx="320" cy="180" rx="260" ry="160" fill="url(#chat05-glow)" />

  <!-- Subtle drafting grid lines -->
  <g stroke="#0b192c" stroke-opacity="0.06" stroke-width="1" stroke-dasharray="3 6">
    <line x1="100" y1="30" x2="100" y2="330" />
    <line x1="210" y1="30" x2="210" y2="330" />
    <line x1="320" y1="20" x2="320" y2="330" />
    <line x1="430" y1="30" x2="430" y2="330" />
    <line x1="540" y1="30" x2="540" y2="330" />
    <line x1="40" y1="100" x2="600" y2="100" />
    <line x1="40" y1="190" x2="600" y2="190" />
    <line x1="40" y1="280" x2="600" y2="280" />
  </g>

  <!-- Stepped Arch Colonnade (Tiered Membership Architecture) -->
  <!-- Outer Arch -->
  <path d="M140 310 V170 A180 140 0 0 1 500 170 V310" stroke="#0b192c" stroke-opacity="0.22" stroke-width="1.75" />
  <!-- Mid Arch (Brass Highlight) -->
  <path d="M190 310 V175 A130 110 0 0 1 450 175 V310" stroke="url(#chat05-brass-beam)" stroke-width="2.2" />
  <!-- Inner Sanctuary Arch -->
  <path d="M245 310 V185 A75 75 0 0 1 395 185 V310" stroke="#0b192c" stroke-opacity="0.28" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Central Crest & Keystone -->
  <path d="M305 68 L320 52 L335 68 L320 84 Z" fill="none" stroke="#8d6c38" stroke-width="2" />
  <line x1="320" y1="84" x2="320" y2="110" stroke="#8d6c38" stroke-width="2" stroke-dasharray="2 3" />
  <circle cx="320" cy="118" r="3.5" fill="#8d6c38" />

  <!-- Flanking Architectural Pilasters -->
  <!-- Left Wing -->
  <rect x="75" y="145" width="28" height="165" rx="3" stroke="#0b192c" stroke-opacity="0.2" stroke-width="1.25" fill="none" />
  <line x1="89" y1="155" x2="89" y2="300" stroke="#8d6c38" stroke-opacity="0.4" stroke-width="1" />
  <rect x="70" y="138" width="38" height="7" rx="1.5" fill="#8d6c38" fill-opacity="0.35" stroke="#8d6c38" stroke-width="1" />

  <!-- Right Wing -->
  <rect x="537" y="145" width="28" height="165" rx="3" stroke="#0b192c" stroke-opacity="0.2" stroke-width="1.25" fill="none" />
  <line x1="551" y1="155" x2="551" y2="300" stroke="#8d6c38" stroke-opacity="0.4" stroke-width="1" />
  <rect x="532" y="138" width="38" height="7" rx="1.5" fill="#8d6c38" fill-opacity="0.35" stroke="#8d6c38" stroke-width="1" />

  <!-- Horizontal Entablature & Pediment Line -->
  <line x1="50" y1="310" x2="590" y2="310" stroke="#0b192c" stroke-opacity="0.35" stroke-width="2" />
  <line x1="70" y1="316" x2="570" y2="316" stroke="#8d6c38" stroke-opacity="0.5" stroke-width="1.5" />
  <line x1="90" y1="322" x2="550" y2="322" stroke="#0b192c" stroke-opacity="0.15" stroke-width="1" />
</svg>
