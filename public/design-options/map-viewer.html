<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الخريطة ثلاثية الأبعاد — معاينة التصميم</title><style>@font-face{font-family:Plex;src:url('/fonts/ibm-plex-arabic/regular.ttf')}*{box-sizing:border-box}body{margin:0;background:#e3eaf4;color:#182d46;font:12px/1.8 Plex,Tahoma,sans-serif}.dark{background:#101827;color:#edf1f7}.frame{position:relative;height:340px;overflow:hidden;background:#e3eaf4}.host{height:100%;width:100%;outline-offset:-3px}.host canvas{display:block;width:100%;height:100%;touch-action:none}.pins{position:absolute;inset:0;pointer-events:none}.pin{position:absolute;pointer-events:auto;transform:translate(-50%,-50%);border:1px solid #748aaa;background:#f4f7fc;color:#172e4a;padding:4px 9px;border-radius:16px;white-space:nowrap;font:inherit;font-size:10px;cursor:pointer}.pin[aria-pressed=true]{background:#173450;color:#fff}.toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 12px;flex-wrap:wrap}.controls{display:flex;gap:5px;flex-wrap:wrap}button{font:inherit;cursor:pointer;border:1px solid #9aadc6;background:#f4f7fc;color:#172e4a;border-radius:5px;min-width:38px;min-height:38px;padding:7px 10px}button:focus-visible,.host:focus-visible{outline:3px solid #b08a53;outline-offset:2px}button:disabled{opacity:.5;cursor:default}.note{font-size:10px;max-width:250px}.detail{min-height:50px;padding:0 14px 12px;font-size:11px}.detail:empty{display:none}.dark button,.dark .pin{background:#1b304d;color:#edf1f7;border-color:#547091}.error{position:absolute;inset:30%;display:grid;place-items:center;text-align:center;background:#edf2f9e8;padding:15px;color:#182d46}.error[hidden]{display:none}@media(max-width:400px){.frame{height:270px}.toolbar{padding:10px}.note{max-width:none}.controls{gap:4px}button{padding:6px 8px}}
</style><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script></head><body><div class="frame"><div class="host" tabindex="0" role="group" aria-label="مشهد ثلاثي الأبعاد؛ اسحب أو استخدم الأسهم للتدوير"></div><div class="pins"></div><p class="error" role="status">جارٍ تجهيز الخريطة ثلاثية الأبعاد…</p></div><div class="toolbar"><div class="controls" role="group" aria-label="أدوات المشهد"><button data-control="left" aria-label="تدوير يسارًا" disabled>↶</button><button data-control="right" aria-label="تدوير يمينًا" disabled>↷</button><button data-control="in" aria-label="تقريب" disabled>+</button><button data-control="out" aria-label="إبعاد" disabled>−</button><button data-control="reset" disabled>إعادة العرض</button><button data-control="play" aria-pressed="false" disabled>تشغيل الحركة</button></div><span class="note">مشهد توضيحي · لا يمثل عقارًا معروضًا أو مواقع حقيقية.</span></div><div class="detail" role="status" aria-live="polite"></div><script type="module">
import { createNeighborhoodScene } from './vendor/neighborhood-scene.js';
import { DEFAULT_DETAILS_DESIGN } from './vendor/details-design.js';
const host=document.querySelector('.host'),pins=document.querySelector('.pins'),detail=document.querySelector('.detail'),media=matchMedia('(prefers-reduced-motion: reduce)'),message=document.querySelector('.error');let scene=null,playing=false;const markers=[...DEFAULT_DETAILS_DESIGN.places,{id:'apartment',ar:'العقار'}];const buttons=new Map();for(const pin of markers){const b=document.createElement('button');b.type='button';b.className='pin';b.textContent=pin.ar;b.setAttribute('aria-pressed','false');b.hidden=true;b.addEventListener('click',()=>{scene?.play(false);playing=false;updatePlay();buttons.forEach(other=>other.setAttribute('aria-pressed',String(other===b)));detail.textContent=pin.ar+' — موقع توضيحي لاستكشاف الخدمات المحيطة بالعقار.';});pins.append(b);buttons.set(pin.id,b)}function updatePlay(){const b=document.querySelector('[data-control=play]');b.textContent=playing?'إيقاف الحركة':'تشغيل الحركة';b.setAttribute('aria-pressed',String(playing))}function theme(){const dark=parent.document.documentElement.classList.contains('dark')||parent.document.body.classList.contains('dark');document.body.classList.toggle('dark',dark);scene?.theme(dark)}try{scene=createNeighborhoodScene(host,positions=>{for(const p of positions){const b=buttons.get(p.id);if(!b)continue;b.hidden=!p.visible;b.style.left=p.x+'px';b.style.top=p.y+'px'}},{places:DEFAULT_DETAILS_DESIGN.places,dark:false,reducedMotion:media.matches,onPlayingChange:value=>{playing=value;updatePlay()}});message.hidden=true;document.querySelectorAll('[data-control]').forEach(b=>b.disabled=false);document.body.dataset.sceneReady='true';theme()}catch{message.textContent='تعذّر تشغيل المشهد في هذا المتصفح. جرّب متصفحًا يدعم WebGL.'}document.querySelectorAll('[data-control]').forEach(b=>b.addEventListener('click',()=>{if(!scene)return;const kind=b.dataset.control;if(kind!=='play'){scene.play(false);playing=false;updatePlay()}if(kind==='left')scene.rotate(-.22);if(kind==='right')scene.rotate(.22);if(kind==='in')scene.zoom(-.12);if(kind==='out')scene.zoom(.12);if(kind==='reset')scene.reset();if(kind==='play'){playing=!playing;scene.play(playing);updatePlay()}}));media.addEventListener('change',()=>scene?.setReducedMotion(media.matches));document.addEventListener('visibilitychange',()=>{if(document.hidden){scene?.play(false);playing=false;updatePlay()}});const observer=new MutationObserver(theme);observer.observe(parent.document.documentElement,{attributes:true,attributeFilter:['class']});observer.observe(parent.document.body,{attributes:true,attributeFilter:['class']});addEventListener('pagehide',()=>{observer.disconnect();scene?.dispose();scene=null});
</script></body></html>
