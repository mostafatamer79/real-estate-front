<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>معرض اتجاهات الصفحة الرئيسية — اختر التصميم المفضل</title>
  <style>
    @font-face {
      font-family: 'Plex';
      src: url('/fonts/ibm-plex-arabic/regular.ttf') format('truetype');
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: 'Plex';
      src: url('/fonts/ibm-plex-arabic/semibold.ttf') format('truetype');
      font-weight: 600;
      font-display: swap;
    }

    :root {
      --bg: #090e17;
      --surface: #0e1624;
      --gold: #d4af37;
      --border: rgba(212, 175, 55, 0.25);
      --text: #f8fafc;
      --muted: #8e9bb0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plex', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      direction: rtl;
    }

    /* Top Command Header */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-shrink: 0;
    }
    .header-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-brand h1 {
      font-size: 16px;
      font-weight: 600;
    }
    .header-brand span {
      font-size: 11px;
      color: var(--gold);
      background: rgba(212, 175, 55, 0.12);
      padding: 2px 8px;
      border-radius: 9999px;
    }

    /* Option Tabs */
    .option-tabs {
      display: flex;
      gap: 8px;
    }
    .tab-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text);
      padding: 8px 16px;
      border-radius: 9999px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 200ms;
    }
    .tab-btn:hover { border-color: var(--gold); }
    .tab-btn.active {
      background: var(--gold);
      color: #090e17;
      border-color: var(--gold);
      box-shadow: 0 4px 14px rgba(212, 175, 55, 0.3);
    }

    /* Viewport Device Controls */
    .device-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 0, 0, 0.4);
      padding: 4px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .device-btn {
      background: none;
      border: none;
      color: var(--muted);
      padding: 6px 12px;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      border-radius: 6px;
      font-weight: 600;
      transition: all 150ms;
    }
    .device-btn:hover { color: var(--text); }
    .device-btn.active {
      background: rgba(255, 255, 255, 0.12);
      color: var(--gold);
    }

    /* Action Buttons */
    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .btn-external {
      color: var(--muted);
      text-decoration: none;
      font-size: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 8px 14px;
      border-radius: 9999px;
      transition: all 200ms;
    }
    .btn-external:hover { color: var(--text); border-color: var(--gold); }
    .btn-select {
      background: var(--gold);
      color: #090e17;
      border: none;
      padding: 8px 20px;
      border-radius: 9999px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 150ms;
    }
    .btn-select:hover { transform: scale(1.03); }

    /* Main Stage */
    .stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #04060a;
      padding: 16px;
      overflow: hidden;
    }
    .viewport-frame {
      width: 100%;
      height: 100%;
      background: #000;
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0,0,0,0.9);
      transition: width 350ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Selection Banner Overlay */
    .toast-overlay {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--gold);
      color: #090e17;
      padding: 14px 28px;
      border-radius: 9999px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 15px 40px rgba(0,0,0,0.8);
      transition: transform 300ms cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1000;
      pointer-events: none;
    }
    .toast-overlay.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <header>
    <div class="header-brand">
      <h1>معرض اتجاهات الصفحة الرئيسية</h1>
      <span>4 خيارات كبرى</span>
    </div>

    <!-- Direction Tabs -->
    <div class="option-tabs">
      <button class="tab-btn active" data-url="full-landing-bc.html" data-code="BC">★ الصفحة الكاملة (B & C المندمجة)</button>
      <button class="tab-btn" data-url="landing-b-sanctuary.html" data-code="B">B — السكينة المعمارية</button>
      <button class="tab-btn" data-url="landing-c-metropolis.html" data-code="C">C — المدينة 3D</button>
      <button class="tab-btn" data-url="landing-a-monolith.html" data-code="A">A — الأيقونة الكينتيكية</button>
      <button class="tab-btn" data-url="landing-d-atelier.html" data-code="D">D — أتيليه الاستثمار</button>
    </div>

    <!-- Device Resizer -->
    <div class="device-controls">
      <button class="device-btn active" data-width="100%">كمبيوتر (100%)</button>
      <button class="device-btn" data-width="768px">تابلت (768px)</button>
      <button class="device-btn" data-width="390px">هاتف (390px)</button>
    </div>

    <div class="header-actions">
      <a href="full-landing-bc.html" target="_blank" id="btnExternal" class="btn-external">فتح بملء الشاشة ↗</a>
      <button id="btnSelectCurrent" class="btn-select">✦ اعتماد هذا الاتجاه</button>
    </div>
  </header>

  <main class="stage">
    <div class="viewport-frame" id="frameContainer">
      <iframe id="previewIframe" src="full-landing-bc.html"></iframe>
    </div>
  </main>

  <div class="toast-overlay" id="toast">
    تم اختيار هذا الاتجاه بنجاح! أخبرني لنطبقه على الفور.
  </div>

  <script>
    const iframe = document.getElementById('previewIframe');
    const frameContainer = document.getElementById('frameContainer');
    const tabBtns = document.querySelectorAll('.tab-btn');
    const deviceBtns = document.querySelectorAll('.device-btn');
    const btnExternal = document.getElementById('btnExternal');
    const btnSelectCurrent = document.getElementById('btnSelectCurrent');
    const toast = document.getElementById('toast');

    let currentUrl = 'full-landing-bc.html';
    let currentCode = 'BC';

    // Switch Option Tab
    tabBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        tabBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentUrl = btn.dataset.url;
        currentCode = btn.dataset.code;
        iframe.src = currentUrl;
        btnExternal.href = currentUrl;
      });
    });

    // Switch Device Width
    deviceBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        deviceBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        frameContainer.style.width = btn.dataset.width;
      });
    });

    // Select Design
    function triggerSelection(code) {
      toast.textContent = `تم تحديد الاتجاه [${code}]! أخبرني بالحرف وسأقوم ببنائه وتطبيقه على الصفحة الرئيسية.`;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3500);
    }

    btnSelectCurrent.addEventListener('click', () => triggerSelection(currentCode));

    // Handle messages from inside the child iframes
    window.addEventListener('message', (e) => {
      if (typeof e.data === 'string' && e.data.startsWith('select_')) {
        const code = e.data.replace('select_', '');
        triggerSelection(code);
      }
    });
  </script>
</body>
</html>
